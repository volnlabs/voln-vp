[package]
name = "voln-vp"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "voln-vp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
walkdir = "2"
which = "8"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3"
tempfile = "3"
